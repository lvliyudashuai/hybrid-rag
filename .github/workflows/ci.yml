name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 刻意不装 torch / sentence-transformers：
      # 测试用假 embedding，几百 MB 的模型不该出现在 CI 里，
      # 这样 20 秒内就能出结果，也能验证"重依赖是否真被懒加载了"。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install langchain-core langchain-text-splitters langchain-chroma chromadb \
                      pypdf python-docx openpyxl jieba python-dotenv \
                      pytest ruff openai anthropic

      - name: 代码检查
        run: ruff check .

      - name: 运行测试
        run: pytest tests -q

  # 主版本的完整依赖也要能装上（含 embedding 相关包）
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 校验 requirements 可解析
        run: |
          python -m pip install --upgrade pip
          # --no-deps：只验证版本约束能不能解析，不真去下 torch（几百 MB）
          pip install --dry-run --no-deps -r requirements.txt
